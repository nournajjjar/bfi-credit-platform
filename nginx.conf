server {
    listen 80;
    client_max_body_size 100M;
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
    location /health {
        proxy_pass http://backend:8000/health;
    }
}